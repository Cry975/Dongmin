<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다음 로그인</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="wrap">
        <!-- 로고 영역 -->
        <div class="logo">kakao</div>

        <!-- 로그인 영역 -->
         <div class="login-box">
            <div class="input-group">
                <input type="text" placeholder="카카오 메일 아이디, 이메일, 전화번호">
            </div>
            <div class="input-group">
                <input type="password" name="pw" id="pw" placeholder="비밀번호">
            </div>
            <div class="save-area">
                <input type="checkbox" name="save" id="save">
                <label for="save">간편 로그인 정보 저장</label>
                <span class="info-icon">i</span>
            </div>
            <button class="login-btn">로그인</button>
            <div class="or-line">
                <span>또는</span>
            </div>
            <button class="qr-btn">QR코드 로그인</button>
            <div class="login-links">
                <div class="left-link">
                    <a href="#">회원가입</a>
                </div>
                <div class="right-link">
                    <a href="#">계정 찾기</a>
                    <a href="#">비밀번호 찾기</a>
                </div>
            </div>
         </div>
         <!-- 푸터 영역 -->
         <div class="footer">
            <a href="#">한국어 ▼</a>
            <span class="bar">|</span>
             <a href="#">이용약관</a>
             <span class="bar">|</span>
             <a href="#"><strong>개인정보 처리방침</strong></a>
             <span class="bar">|</span>
             <a href="#">고객센터</a>
             <span class="copyright">&copy; Kakao Corp</span>
         </div>
    </div>
</body>
</html>
