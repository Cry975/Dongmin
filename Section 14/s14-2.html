<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 박스모델</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .wrap {
            width: 800px;
            margin: 20px auto;
            background-color: #eee;
            padding: 20px;
        }

        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid black;
            background-color: lightblue;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box">첫 번째 박스</div>
        <div class="box">두 번째 박스</div>
    </div>
</body>
</html>
