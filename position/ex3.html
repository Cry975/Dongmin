<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative, absolute 예시3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .search-box {
            width: 400px;
            margin: 100px auto;
            position: relative; /* 부모 요소 */ 
        }
        .search-box input {
            width: 100%;
            height: 50px;
            padding: 0 50px 0 15px;
            border: 2px solid #333;
            border-radius: 30px;
        }
        .search-box button {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 50px;
            border: none;
            background: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" placeholder="검색어를 입력하세요">
        <button><img src="./sch_btn.png" alt="검색 버튼"></button>
    </div>
</body>
</html>
