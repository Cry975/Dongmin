<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        .wrap {
            width: 300px;
            height: 300px;
            border: 5px solid black;
            position: relative;
        }
        .box {
            width: 100px;
            height: 100px;
        }
        .a {
            background-color: cornflowerblue;
            position: fixed;
            top: 15px;
            left: 15px;
            /* z-index: auto(0) (기본값으로 지정된 상태) */
        }
        .b {
            background-color: salmon;
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1;
        }
        .c {
            background-color: darkseagreen;
            position: relative;
            top: 60px;
            left: 60px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box a">A</div>
        <div class="box b">B</div>
        <div class="box c">C</div>
    </div>
</body>
</html>
