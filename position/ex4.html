<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed, sticky 예시</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        a {
            text-decoration: none;
            color: white;
        }

        html {     /* 스크롤 동작 부드럽게 하는 속성 */
            scroll-behavior: smooth;
        }


        header {
            background-color: lightgrey;
            height: 120px;
            line-height: 120px;
            text-align: center;
            font-size: 30px;
        }
        .menu {
            background-color: #222;
            position: sticky;
            top: 0;
        }
        .menu ul {
            width: 1000px;
            margin: 0 auto; /* 가운데 정렬 : 요소의 크기가 지정되어 있어야 사용 가능함 */
            list-style: none; /* 리스트 기호 제거 */
            overflow: hidden;
        }
        .menu ul li {
            padding: 20px 30px;
            float: left;   
        }
        .main {
            width: 1000px;
            margin: 0 auto;
        }
        .section {
            border: 1px solid #ccc;
            height: 500px;
            line-height: 500px;
            text-align: center;
            font-size: 30px;
            margin: 30px 0;
        }
        .top-btn {
          width: 60px;
          height: 60px;
          background-color: #222;
          display: block;
          line-height: 60px;
          text-align: center;
          border-radius: 50%;
          position: fixed;
          right: 30px;
          bottom: 30px;
        }

    </style>
</head>
<body id="top">
    <header class="header">상단 영역</header>
    <nav class="menu">
        <ul>
            <li><a href="#con1">소개</a></li>
            <li><a href="#con2">서비스</a></li>
            <li><a href="#con3">포트폴리오</a></li>
        </ul>
    </nav>
    <main class="main">
        <div class="section" id="con1">콘텐츠 1</div>
        <div class="section" id="con2">콘텐츠 2</div>
        <div class="section" id="con3">콘텐츠 3</div>
    </main>
    <a href="#top" class="top-btn">TOP</a>
</body>
</html>
