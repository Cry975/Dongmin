<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            display: flex;
            
            gap: 10px;
            resize: horizontal;
            overflow-x: scroll;
            overflow-y: auto;
            border: 5px solid black;
        }
        .item {
            font-weight: bold; text-align: center;
            margin: 1px;
            padding: 10px 30px;
            border: 3px solid tomato;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            123456789123456789123456789
        </div>
    </div>
</body>
</html>
