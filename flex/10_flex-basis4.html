<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            width: 500px;
            border: 5px solid black;
            background-color: #eee;
            padding: 1px;
            display: flex;
        }
        .item {
            font-weight: bold; text-align: center; padding: 10px;
            border: 3px solid tomato;
            background-color: #fff;
            margin: 1px;
            
        }
        .item:nth-child(1) { width: 50px; }
        .item:nth-child(2) { width: 100px; }
        .item:nth-child(3) { width: 150px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
    </div>
    <span>Flex box Layout</span>
</body>
</html>
