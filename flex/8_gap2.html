<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            width: 500px;
            border: 5px solid black; background-color: #eee;
            padding: 1px;
            display: flex;
            flex-wrap: wrap;
            /*row-gap: 10px;
            column-gap: 30px;*/
            gap: 10px 30px;      
          }
          
        .item {
            font-weight: bold; text-align: center; padding: 10px;
            border: 3px solid tomato; background-color: #fff;
            margin: 1px;
            width: 120px;
        }
        .item:nth-child(even) {
            border: 3px solid dodgerblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
    <span>Flex box Layout</span>
</body>
</html>
