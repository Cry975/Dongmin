<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid, Flex 레이아웃 예시</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="wrap">
        <header class="header">
            <div class="logo">LOGO</div>
            <nav class="nav">NAVIGATION</nav>
        </header>

        <aside class="sidebar">
            SIDEBAR
        </aside>

        <main class="main">
            <section class="hero">
                <div class="hero-text">MAIN TEXT</div>
                <div class="hero-image">MAIN IMAGE</div>
            </section>

            <section class="section-title">
                <h2>CONTENT TITLE</h2>
                <p>MORE</p>
            </section>

            <section class="card-grid">
                <article class="card">
                    <div class="img">IMG</div>
                    <h3>TITLE 1</h3>
                    <p>TEXT AREA</p>
                </article>

                <article class="card">
                    <div class="img">IMG</div>
                    <h3>TITLE 2</h3>
                    <p>TEXT AREA</p>
                </article>

                <article class="card">
                    <div class="img">IMG</div>
                    <h3>TITLE 3</h3>
                    <p>TEXT AREA</p>
                </article>

                <article class="card">
                    <div class="img">IMG</div>
                    <h3>TITLE 4</h3>
                    <p>TEXT AREA</p>
                </article>
            </section>
        </main>

        <footer class="footer">FOOTER</footer>
    </div>
</body>
</html>
